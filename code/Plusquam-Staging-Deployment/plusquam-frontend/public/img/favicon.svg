<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="plusquam">
  <rect width="100" height="100" rx="22" fill="#3C45E8"/>
  <g fill="#FFFFFF">
    <!-- vertical arm (middle column, x=45) -->
    <rect x="45" y="10"   width="10" height="10"/>
    <rect x="45" y="27.5" width="10" height="10"/>
    <rect x="45" y="45"   width="10" height="10"/>
    <rect x="45" y="62.5" width="10" height="10"/>
    <rect x="45" y="80"   width="10" height="10"/>
    <!-- horizontal arm (middle row, y=45) -->
    <rect x="10"   y="45" width="10" height="10"/>
    <rect x="27.5" y="45" width="10" height="10"/>
    <rect x="62.5" y="45" width="10" height="10"/>
    <rect x="80"   y="45" width="10" height="10"/>
  </g>
</svg>
